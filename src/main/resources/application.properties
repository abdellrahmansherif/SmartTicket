spring.application.name=SmartTicket

# Load environment variables from .env
spring.config.import=optional:file:.env[.properties]

# Disable Spring Boot automatic Docker Compose management
spring.docker.compose.enabled=false
server.forward-headers-strategy=framework


# ===============================
# DATABASE
# ===============================

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:SmartTicket_db}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.datasource.hikari.initialization-fail-timeout=10000


# ===============================
# JPA
# ===============================

spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never


# ===============================
# CLOUDINARY
# ===============================

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}


# ===============================
# REDIS
# ===============================

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}


# ===============================
# ACTUATOR
# ===============================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never