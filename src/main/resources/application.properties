spring.application.name=SmartTicket
spring.config.import=optional:file:.env[.properties]

spring.docker.compose.enabled=false

# ===============================
# DATABASE
# ===============================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/SmartTicket_db}
spring.datasource.username=${DB_USERNAME:abdo}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.initialization-fail-timeout=10000

# ===============================
# JPA
# ===============================
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never

# ===============================
# CLOUDINARY
# ===============================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ===============================
# REDIS
# ===============================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}


management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never